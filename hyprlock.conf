animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
  monitor = 
  path = ~/.config/wallpapers/vin.png
  blur_passes = 2
  noise = 0.0119
  contrast = 1.2
  brightness = 0.8
  vibrancy = 0.169
  virbrancy_darkness = 0.0
}

input-field {
  monitor = 
  size = 20%, 5%
  position = 0, 0
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  fade_on_emptry = true
  placeholder_text = <i>Password...</i>
  hide_input = false
  halign = center
  valign = center
}

label {
  monitor = 
  text = Locked
  color = rgba(255, 255, 255, 0.7)
  font_family = JetBrainsMono Nerd Font
  font_size = 20
  position = 0, -200
  halign = center
  valign = center
}

label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = 0, 0
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -150
    halign = center
    valign = top
}
